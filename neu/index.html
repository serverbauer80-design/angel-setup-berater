<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rutenwand</title>
  <meta name="description" content="Angel-Setup-Berater, neue Oberfläche: deine Setups auf einen Blick.">
  <meta name="theme-color" content="#edf1f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1318" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="app.css">
  <script>
    /* Theme vor dem ersten Zeichnen setzen, sonst blitzt beim Laden das falsche auf */
    try { var t = localStorage.getItem("neu_theme_v1"); if(t === "hell") document.documentElement.dataset.theme = "light"; if(t === "dunkel") document.documentElement.dataset.theme = "dark"; } catch(e){}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="seite" aria-label="Bereiche">
      <div class="seite-logo">Rutenwand</div>
      <nav class="seite-nav" id="seite-nav"></nav>
      <div class="seite-fuss">
        <a class="alt-link" href="../index.html?alt=1">Bisherige App (Archiv)</a>
      </div>
    </aside>

    <div class="haupt">
      <header class="kopf">
        <h1 id="kopf-titel">Rutenwand</h1>
        <div class="kopf-aktionen">
          <button type="button" class="sync-chip" id="sync-chip" aria-haspopup="dialog">Nicht angemeldet</button>
          <button type="button" class="rund" id="theme-btn" aria-label="Hell oder dunkel umschalten" title="Hell/Dunkel"></button>
        </div>
      </header>

      <main id="inhalt" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Bereiche"></nav>

  <dialog id="sync-dialog" class="dialog">
    <form method="dialog" class="dialog-kopf">
      <h2>Geräte-Synchronisation</h2>
      <button class="rund" value="zu" aria-label="Schließen">✕</button>
    </form>
    <div id="sync-inhalt"></div>
  </dialog>

  <dialog id="blatt" class="dialog blatt" aria-label="Bearbeiten"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script>
    /* Dieselbe Firebase-App wie die bisherige Oberfläche: gleicher Login, gleiches Sync-Dokument */
    try {
      firebase.initializeApp({
        apiKey: "AIzaSyAVgGGBpJ3Hg3a1GhBhsJ63eSkDZQZV_tU",
        authDomain: "angel-setup-berater.firebaseapp.com",
        projectId: "angel-setup-berater",
        storageBucket: "angel-setup-berater.firebasestorage.app",
        messagingSenderId: "557649371251",
        appId: "1:557649371251:web:7e296ead21fb8f156fca06"
      });
      firebase.firestore().enablePersistence({ synchronizeTabs: true }).catch(function(){});
    } catch(e){ window.FIREBASE_FEHLT = true; }
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Gemeinsame Datengrundlage mit der bisherigen App -->
  <script src="../data.js"></script>
  <script src="../ausruestung.js"></script>
  <script src="../berater.js"></script>
  <script type="module" src="js/main.js"></script>
  <script>
    /* Neuerungen sofort laden: beim Öffnen und bei jeder Rückkehr zur App
       (iPhone-Homescreen, anderer Tab) nach einer neuen Version fragen.
       Neue Version da → Seite lädt neu. Ist gerade ein Formular offen,
       erscheint stattdessen ein Hinweis mit „Neu laden“ – nichts geht verloren. */
    if("serviceWorker" in navigator){
      var hatteSW = !!navigator.serviceWorker.controller, geladen = Date.now(), zuletzt = 0, laedt = false;
      navigator.serviceWorker.register("sw.js", { scope: "./", updateViaCache: "none" }).then(function(reg){
        function pruefe(){ if(Date.now() - zuletzt < 30000) return; zuletzt = Date.now(); reg.update().catch(function(){}); }
        document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") pruefe(); });
        window.addEventListener("pageshow", function(e){ if(e.persisted) pruefe(); });
        window.addEventListener("focus", pruefe);
        setInterval(pruefe, 30 * 60 * 1000);
      }).catch(function(){});
      function beschaeftigt(){
        if(document.querySelector("dialog[open]")) return true;
        var a = document.activeElement;
        return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.value);
      }
      function neuLaden(){ if(laedt) return; laedt = true; location.reload(); }
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if(!hatteSW){ hatteSW = true; return; }          /* allererste Installation: Seite ist schon aktuell */
        if(Date.now() - geladen < 4000) return;          /* direkt beim Start: Dateien kamen eh frisch aus dem Netz */
        if(!beschaeftigt()){ neuLaden(); return; }
        var b = document.getElementById("update-hinweis");
        if(b){ b.hidden = false; return; }
        b = document.createElement("div"); b.id = "update-hinweis"; b.setAttribute("role", "status");
        b.innerHTML = '<span>Neue Version ist da</span><button type="button" class="knopf prim klein">Neu laden</button>';
        b.querySelector("button").addEventListener("click", neuLaden);
        document.body.appendChild(b);
      });
    }
  </script>
</body>
</html>
